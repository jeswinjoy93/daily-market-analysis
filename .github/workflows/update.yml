# Keeps the public dashboard (GitHub Pages) up to date without a server.
#
# Covers India (Trendvue) and the US (TradingView screener). Every run downloads the SQLite databases from
# the "data" release, fetches each market when it's due (market.py decides: every run during that market's
# hours, then after its close until the day's final data is in), saves the databases back to the release,
# and rebuilds the static site.
#
# Runs keep themselves going: the last job waits until the next due time (every 5 min while either market
# is open or finishing its day, otherwise the next open) and then starts the next run. GitHub's cron
# schedule is unreliable (runs can be delayed for hours or dropped), so it is only a backup that restarts
# the chain if it ever stops. Only one waiting job exists at a time: a newer one cancels the older.
name: Update dashboard

on:
  schedule:
    # Backup only. Every 15 min, 03:07–21:52 UTC Mon–Fri: India 08:37 IST to the US close and final data
    # (cron is UTC; odd minutes dodge the top-of-hour backlog).
    - cron: "7,22,37,52 3-21 * * 1-5"
  workflow_dispatch:   # "Run workflow" button = fetch right away
    inputs:
      force:
        description: "Fetch now even if nothing is due"
        type: boolean
        default: true
      triage:
        description: "Also write the Setups triage notes now (normally after the close), for stocks without notes"
        type: boolean
        default: false
  push:
    branches: [main]   # code changes: rebuild the site from the stored data

permissions:
  contents: write      # update the "data" release and the keep-alive commit
  pages: write
  id-token: write
  actions: write       # start the next run

env:
  TZ: Asia/Kolkata
  MARKET_DB: data/market.db
  MARKET_DB_US: data/market_us.db
  GH_TOKEN: ${{ github.token }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:       # one update at a time, so database uploads never overlap
      group: update-dashboard
      cancel-in-progress: false
    outputs:
      built: ${{ steps.build.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download databases
        run: |
          mkdir -p data
          for db in market market_us; do
            if gh release download data --pattern "$db.db.gz" --dir data; then
              gunzip -f "data/$db.db.gz"
            else
              echo "No stored $db.db yet; starting empty."
            fi
          done

      # Optional: lets the Setups triage read concall transcripts (PDFs) itself. Without it, triage.py uses
      # DeepSeek's fetch API for them, or skips the guidance.
      - name: Install pypdf
        if: github.event_name != 'push'
        run: python3 -m pip install --quiet --user --break-system-packages "pypdf==5.1.0" || echo "pypdf not installed; continuing without it"

      - name: Fetch new data
        id: fetch
        if: github.event_name != 'push'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}   # Setups triage notes; without it only the code-only parts
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python3 market.py snapshot in,us
          else
            python3 market.py auto in,us
          fi

      - name: Triage now
        id: triage
        if: "!cancelled() && github.event_name == 'workflow_dispatch' && inputs.triage"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 market.py triage

      # !cancelled(): if one market's fetch failed, still save and publish the other's new data.
      - name: Save databases
        if: "!cancelled() && (steps.fetch.outputs.changed == 'true' || steps.triage.outputs.changed == 'true')"
        run: |
          gh release view data > /dev/null 2>&1 || gh release create data --prerelease --title "Dashboard data" \
            --notes "SQLite databases maintained by the Update dashboard workflow (market.db.gz: India, market_us.db.gz: US). Not a software release."
          for db in data/market.db data/market_us.db; do
            if [ -f "$db" ]; then gzip -kf "$db" && gh release upload data "$db.gz" --clobber; fi
          done

      - name: Build site
        id: build
        if: "!cancelled() && (steps.fetch.outputs.changed == 'true' || steps.triage.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force))"
        run: python3 market.py export site   # every market with stored data

      - uses: actions/upload-pages-artifact@v5
        if: "!cancelled() && steps.build.outcome == 'success'"
        with:
          path: site
          retention-days: 1

      # GitHub pauses cron schedules in public repos after 60 days without repository activity.
      - name: Keep the schedule alive
        if: "!cancelled() && github.event_name != 'push'"
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled dashboard updates running"
            git push
          fi

  deploy:
    needs: update
    if: "!cancelled() && needs.update.outputs.built == 'true'"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  next:
    needs: [update, deploy]
    if: always()       # keep the chain going even if this run's fetch failed
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:       # only one waiting job: a newer run's one replaces this
      group: dashboard-next
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Wait until the next update is due, then start it
        run: |
          secs=$(python3 market.py next-wait in,us)
          echo "Next run in $((secs / 60)) min"
          sleep "$secs"
          gh workflow run update.yml --repo "${{ github.repository }}" -f force=false
