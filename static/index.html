<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Market Analysis</title>
<script>window.STATIC_SITE = false;</script><!-- set to true by `market.py export` (GitHub Pages build) -->
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --up: #2a78d6; --down: #e34948;            /* diverging bar fills (validated pair) */
  --up-text: #006300; --down-text: #c42f2f;  /* delta text */
  --mid: #f0efec; --hover: rgba(11,11,11,0.04);
  --price-bar: #0b0b0b;
  --ema20: #2a78d6; --ema50: #eb6834; --ema200: #1baf7a;
  --strong-bg: #008300;  /* white text 4.95:1 */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --up: #3987e5; --down: #e66767; --up-text: #0ca30c; --down-text: #ef7b7b;
    --mid: #383835; --hover: rgba(255,255,255,0.05);
    --price-bar: #f0efec;  /* black bars would vanish on the dark surface */
    --ema20: #3987e5; --ema50: #d95926; --ema200: #199e70;
    --strong-bg: #118a11;  /* white text 4.5:1, 3.9:1 against the dark surface */
  }
}
* { box-sizing: border-box; }
/* Reserve the scrollbar's space even when the page is short, so switching Strong/All doesn't shift the width. */
html { scrollbar-gutter: stable; }
@supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
/* Every page uses the full window width (Setups needs it for the chart), so the header stays put when switching pages */
.wrap { margin: 0 auto; padding: 28px 24px 64px; }
@media (max-width: 520px) { .wrap { padding-left: 16px; padding-right: 16px; } }
/* title, then the controls on their own row from the left at every width: the page switch never moves */
header { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; margin-bottom: 20px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); margin: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button:hover, select:hover { background: var(--hover); }
.tv { display: inline-flex; }
.tv button:first-child { border-radius: 8px 0 0 8px; }
.tv button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 6px 10px; }
[hidden] { display: none !important; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
h2 .dot { width: 10px; height: 10px; border-radius: 3px; }
.item { border-top: 1px solid var(--grid); }
.item:first-child { border-top: 0; }
.mover { display: grid; grid-template-columns: 20px 1fr auto auto; gap: 10px; align-items: baseline;
  padding: 8px 4px; margin: 0 -4px; border-radius: 6px; cursor: pointer; }
.mover:hover { background: var(--hover); }
.mover .caret { width: 12px; font-size: 11px; }
.item.open .caret { transform: rotate(90deg); }
.stocks { max-height: 340px; overflow-y: auto; margin: 0 0 10px 30px; padding: 6px 10px; border-radius: 8px; background: var(--page); border: 1px solid var(--border); }
.stocks .hd { position: sticky; top: -6px; background: var(--page); padding-top: 2px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px;
  display: grid; grid-template-columns: 1fr repeat(3, 56px); gap: 8px; }
.stock { display: grid; grid-template-columns: 1fr repeat(3, 56px); gap: 8px; align-items: baseline; padding: 3px 0; font-size: 13px; }
.stock > * { min-width: 0; }
.stock .sym { font-weight: 600; }
.stock .co { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stock .num, .stocks .hd span:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
.rank { color: var(--muted); font-variant-numeric: tabular-nums; }
.mover .name { font-weight: 550; }
/* name + (near/total) on one line: long names are cut with "…" (full name on hover), the count always shows */
.nm { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
.nm .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.nm .nc { flex-shrink: 0; }
.gtable td.name { width: 100%; max-width: 0; }
.nc { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mover .vals { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta.up { color: var(--up-text); } .delta.down { color: var(--down-text); } .delta.flat { color: var(--muted); }
.grid2 > *, .mover > * { min-width: 0; }
@media (max-width: 520px) {
  .mover { grid-template-columns: 20px 1fr auto; row-gap: 2px; }
  .mover .vals { grid-column: 2; grid-row: 2; font-size: 12px; }
}
.empty { color: var(--muted); padding: 8px 0; }
.notice { background: var(--surface); border: 1px dashed var(--axis); border-radius: 12px; padding: 12px 16px;
  margin-bottom: 16px; color: var(--ink-2); }


/* all sectors / all industries tables */
.gtable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.gtable th, .gtable td { padding: 8px 6px; border-top: 1px solid var(--grid); text-align: right; vertical-align: baseline; }
.gtable th { border-top: 0; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; padding-top: 0; }
.gtable th.sortable { cursor: pointer; user-select: none; }
.gtable th.sortable:hover, .gtable th.sorted { color: var(--ink); }
.gtable th:nth-child(-n+2), .gtable td:nth-child(-n+2) { text-align: left; }
.gtable td.rank { width: 22px; padding-left: 4px; }
.gtable td.name .name { font-weight: 550; }
.gtable td.num { color: var(--ink-2); white-space: nowrap; }
.gtable tr.row { cursor: pointer; }
.gtable tr.row:hover td { background: var(--hover); }
.gtable tr.open .caret { transform: rotate(90deg); }
.gtable td.panel { padding: 0 0 4px; border-top: 0; text-align: left; }
@media (max-width: 520px) {
  .delta .u { display: none; }  /* "+4.7" instead of "+4.7 pts": more room for names */
  .gtable th, .gtable td { padding-left: 3px; padding-right: 3px; }
  .gtable td.rank { width: 16px; padding-left: 0; }
  .gtable td.num, .gtable td.delta { font-size: 13px; }
}
.caret { display: inline-block; width: 14px; font-style: normal; color: var(--muted); transition: transform .15s; }
.hint { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: auto; }
.status { color: var(--muted); font-size: 12px; min-height: 18px; }
.live { display: inline-block; font-size: 11px; font-weight: 650; letter-spacing: .05em; padding: 1px 7px; margin-right: 4px;
  border-radius: 999px; background: var(--ink); color: var(--surface); vertical-align: 1px; }

/* Setups page: stock list on the left, chart on the right */
.setups { display: grid; grid-template-columns: 250px minmax(0, 1fr); padding: 0; overflow: hidden; }
.slist { border-right: 1px solid var(--border); height: 0; min-height: 100%; overflow-y: auto; padding: 12px 8px; }
.slhd { padding: 0 8px 10px; font-weight: 600; font-size: 15px; }
.sitem { display: block; width: 100%; text-align: left; border: 0; border-radius: 8px; padding: 7px 10px; margin: 1px 0;
  background: transparent; }
.sitem:hover { background: var(--hover); }
.sitem[aria-selected="true"] { background: var(--mid); box-shadow: inset 3px 0 0 var(--ink); }
.sitem .srow { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sitem .sym { font-weight: 600; }
.sitem .co { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.schart { padding: 14px 16px 10px; min-width: 0; }
.chd { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.chd .csym { font-size: 18px; font-weight: 650; color: var(--ink); text-decoration: none; }
.chd .csym:hover { text-decoration: underline; }
.chd .cquote { margin-left: 10px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chd .cquote a { color: var(--ink-2); white-space: nowrap; }
.cstats .scan { display: inline-block; margin-left: 6px; padding: 0 7px; border: 1px solid var(--axis); border-radius: 999px;
  font-size: 12px; color: var(--ink-2); white-space: nowrap; vertical-align: 1px; }
.cstats .sec.strong { background: var(--strong-bg); color: #fff; font-weight: 600; border-radius: 4px; padding: 1px 7px; cursor: help; }
.cnav { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cnav button { padding: 2px 9px; }
.cstats { color: var(--ink-2); font-size: 13px; margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
.cstats a { color: var(--ink-2); }
.ctools { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.ctools .cnav { margin-left: 4px; }
.ctools .seg button { padding: 3px 9px; font-size: 13px; }
.clegend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; min-height: 18px; }
.clegend .k { color: var(--muted); }
.clegend .sw { display: inline-block; width: 12px; height: 2px; border-radius: 1px; vertical-align: 3px; margin-right: 4px; opacity: .6; }
.chart { position: relative; width: 100%; touch-action: pan-y; }
.chart svg { display: block; width: 100%; user-select: none; }
.chart text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .tag text { fill: var(--surface); font-weight: 600; }
.chart .tag rect { fill: var(--ink); }
.chart .xh { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
.chempty { color: var(--muted); padding: 60px 0; text-align: center; }
@media (max-width: 720px) {
  .setups { grid-template-columns: minmax(0, 1fr); }
  .schart { padding: 12px 12px 8px; }
  .chd { grid-template-columns: minmax(0, 1fr); }  /* controls go to their own row */
  .ctools { flex-wrap: wrap; }
  .slist { border-right: 0; border-bottom: 1px solid var(--border); height: auto; min-height: 0; max-height: 230px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Daily Market Analysis</h1>
      <p class="sub" id="subtitle">Loading…</p>
    </div>
    <div class="controls">
      <div class="seg" id="pageSeg" role="group" aria-label="Page">
        <button data-page="breadth" title="Sector and industry breadth: % of stocks near their 52-week high">Breadth</button><button data-page="setups" title="India: stocks in Trendvue's High Tight Flag, Near All-Time High or Top Movers scans that are also in Tight Consolidation and close above EMA 50, with charts">Setups</button>
      </div>
      <div class="seg" id="marketSeg" role="group" aria-label="Market" hidden></div>
      <div class="seg" id="viewSeg" role="group" aria-label="View">
        <button data-view="strong" title="Top 5 cards: strongest today and strongest overall">Strong</button><button data-view="all" title="Every sector and industry, sortable">All</button>
      </div>
      <div class="seg" id="metricSeg" role="group" aria-label="Within % of 52-week high"></div>
      <span class="tv">
        <button id="tvCopy" title="Copy the stocks in this view as a TradingView watchlist. Strong: the 4 cards. All: every sector, with a sub-section per industry. Setups: the setup stocks.">Copy for TradingView</button><button id="tvDownload" title="Download as a .txt file for TradingView: watchlist menu → Import list…" aria-label="Download TradingView watchlist file">↓ .txt</button>
      </span>
    </div>
  </header>
  <div class="status" id="status"></div>
  <div id="notice"></div>

  <div id="viewStrong">
  <div class="grid2">
    <section class="card"><h2><span class="dot" style="background:var(--up)"></span>Top 5 strong sectors today<span class="hint">click for stocks</span></h2><div id="strength"></div></section>
    <section class="card"><h2><span class="dot" style="background:var(--up)"></span>Top 5 strong industries today<span class="hint">click for stocks</span></h2><div id="industryStrength"></div></section>
  </div>

  <div class="grid2">
    <section class="card"><h2>Top 5 strong sectors<span class="hint">click for stocks</span></h2><div id="topSectors"></div></section>
    <section class="card"><h2>Top 5 strong industries<span class="hint">click for stocks</span></h2><div id="topIndustries"></div></section>
  </div>
  </div>

  <div id="viewSetups" hidden>
    <section class="card setups">
      <div class="slist" id="setupList" role="listbox" aria-label="Setup stocks"></div>
      <div class="schart" id="setupChart"></div>
    </section>
  </div>

  <div class="grid2" id="viewAll" hidden>
    <section class="card"><h2 id="secHead">All sectors<span class="hint">click for stocks</span></h2><table class="gtable" id="secTable"></table></section>
    <section class="card"><h2 id="indHead">All industries<span class="hint">click for stocks</span></h2><table class="gtable" id="indTable"></table></section>
  </div>
</div>

<script>
const METRICS = [["near_52w_5","5%"],["near_52w_10","10%"],["near_52w_15","15%"],["near_52w_20","20%"]];
const state = { page: "breadth", market: "in", markets: [], view: "strong", metric: "near_52w_10", date: null, data: null, sort: { sector: { key: "value", dir: -1 }, industry: { key: "value", dir: -1 } }, openStocks: new Set() };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = v => v == null ? "—" : v.toFixed(1) + "%";
const fmtD = v => v == null ? "—" : (v > 0 ? "▲ +" : v < 0 ? "▼ " : "") + v.toFixed(1) + `<span class="u"> pts</span>`;  // HTML
const cls = v => v == null || v === 0 ? "flat" : v > 0 ? "up" : "down";
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" }) : "";
const pctLabel = () => METRICS.find(m => m[0] === state.metric)[1];

try { const m = localStorage.getItem("metric"); if (METRICS.some(x => x[0] === m)) state.metric = m; } catch (e) {}

// Strong (top 5 cards) | All (sector and industry tables); remembered like the % choice.
try { const v = localStorage.getItem("view"); if (v === "strong" || v === "all") state.view = v; } catch (e) {}
// Breadth (the cards/tables) | Setups (scan stocks with charts); remembered, and #setups in the URL opens Setups.
try { const p = localStorage.getItem("page"); if (p === "breadth" || p === "setups") state.page = p; } catch (e) {}
if (location.hash === "#setups") state.page = "setups";
function renderView() {
  const setupsPage = state.page === "setups";
  document.querySelectorAll("#pageSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.page === state.page));
  document.querySelectorAll("#viewSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === state.view));
  $("viewStrong").hidden = setupsPage || state.view !== "strong";
  $("viewAll").hidden = setupsPage || state.view !== "all";
  $("viewSetups").hidden = !setupsPage;
  // breadth-only controls (the Setups scans are India's, at their own criteria)
  $("viewSeg").hidden = $("metricSeg").hidden = setupsPage;
  $("marketSeg").hidden = setupsPage || state.markets.length < 2;
}
$("pageSeg").addEventListener("click", e => {
  const p = e.target.dataset.page; if (!p || p === state.page) return;
  state.page = p; try { localStorage.setItem("page", p); } catch (e) {}
  history.replaceState(null, "", p === "setups" ? "#setups" : location.pathname + location.search);
  $("status").textContent = "";
  renderView();
  if (p === "setups") {
    if (!setups.data) loadSetups().catch(setupsFailed);
    else { renderSetups(); if (setups.strongMetric !== state.metric) loadStrongSectors().then(renderSetupChart); }
  }
  else if (state.data) render();
});
$("viewSeg").addEventListener("click", e => {
  const v = e.target.dataset.view; if (!v) return;
  state.view = v; try { localStorage.setItem("view", v); } catch (e) {}
  renderView();
});
renderView();

function renderMetricSeg() {
  $("metricSeg").innerHTML = METRICS.map(([k, l]) =>
    `<button data-k="${k}" aria-pressed="${k === state.metric}">${l}</button>`).join("");
}
$("metricSeg").addEventListener("click", e => {
  const k = e.target.dataset.k; if (!k) return;
  state.metric = k; try { localStorage.setItem("metric", k); } catch (e) {}
  renderMetricSeg(); load();
});

async function load() {
  state.data = window.STATIC_SITE ? await loadStatic() : await fetch("/api/compare?" + new URLSearchParams(
    { market: state.market, metric: state.metric, ...(state.date ? { date: state.date } : {}) })).then(r => r.json());
  render();
}

// India | US switch: shown when more than one market is available; remembered like the % choice.
try { const m = localStorage.getItem("market"); if (m) state.market = m; } catch (e) {}
async function loadMarkets() {
  try {
    state.markets = window.STATIC_SITE
      ? await fetch("data/markets.json", { cache: "no-store" }).then(r => r.json())
      : await fetch("/api/markets").then(r => r.json());
  } catch (e) { state.markets = [{ id: "in", name: "India" }]; }
  if (!state.markets.some(m => m.id === state.market)) state.market = state.markets[0]?.id || "in";
  renderMarketSeg();
}
function renderMarketSeg() {
  $("marketSeg").hidden = state.page === "setups" || state.markets.length < 2;
  $("marketSeg").innerHTML = state.markets.map(m =>
    `<button data-market="${m.id}" aria-pressed="${m.id === state.market}">${esc(m.name)}</button>`).join("");
}
$("marketSeg").addEventListener("click", e => {
  const m = e.target.dataset.market; if (!m || m === state.market) return;
  state.market = m; state.openStocks.clear(); try { localStorage.setItem("market", m); } catch (e) {}
  renderMarketSeg(); load();
});

// Static site (GitHub Pages): data/<market>/index.json lists the sessions; data/<market>/<date>.json has every threshold.
const sessionFiles = {};
async function loadStatic(market = state.market) {
  const getJSON = url => fetch(url, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status + " " + url); return r.json(); });
  const idx = await getJSON(`data/${market}/index.json`);
  if (!idx.dates.length) return { date: null, dates: [] };
  const date = idx.dates.includes(state.date) ? state.date : idx.dates[0];
  const key = `${market}/${date}@${idx.generated_at}`;  // re-download only when the site has been rebuilt
  const f = sessionFiles[key] || (sessionFiles[key] = await getJSON(`data/${market}/${date}.json`));
  // The session file lists stocks within the widest threshold; keep those within the selected one.
  const within = +state.metric.split("_").pop();
  const keep = groups => Object.fromEntries(Object.entries(groups).map(([g, list]) => [g, list.filter(st => st.dist >= -within)]));
  return { ...f, ...f.by_metric[state.metric], metric: state.metric, dates: idx.dates, live_dates: idx.live_dates,
           top_stocks: { sector: keep(f.top_stocks.sector), industry: keep(f.top_stocks.industry) }, max_dist_from_high: within };
}

// Top 5 stocks closest to their 52-week high, shown when a card row is expanded.
const r1 = v => v == null ? null : (Math.round(v * 10) / 10 || 0);  // round to 0.1, no "-0.0"
function stocksPanel(kind, name) {
  const list = (state.data.top_stocks || {})[kind]?.[name];
  const minCap = state.data.mcap_label || "₹1,000 cr";
  if (!list || !list.length) return `<div class="stocks"><div class="empty">No stocks with market cap ≥ ${minCap} within ${state.data.max_dist_from_high ?? 10}% of their 52W high.</div></div>`;
  return `<div class="stocks"><div class="hd"><span title="Closest to their 52-week high first">Stock (${list.length})</span><span>1D</span><span>1W</span><span>1M</span></div>` +
    list.map(st => `<div class="stock">
      <span><span class="sym">${esc(st.symbol)}</span><span class="co">${esc(st.company || "")}</span></span>
      ${[st.change_1d, st.change_1w, st.change_1m].map(v => `<span class="num delta ${v == null ? "flat" : cls(r1(v))}">${v == null ? "—" : (r1(v) > 0 ? "+" : "") + r1(v).toFixed(1) + "%"}</span>`).join("")}
    </div>`).join("") + `</div>`;
}
function nearCount(kind, r) {  // "(14/42)": stocks near their 52W high / stocks in the group
  const n = ((state.data.top_stocks || {})[kind]?.[r.name] || []).length;
  const cap = state.data.mcap_label || "₹1,000 cr";
  return ` <span class="nc" title="${n} of ${r.stock_count} stocks (market cap ≥ ${cap}) are within ${state.data.max_dist_from_high ?? 10}% of their 52W high">(${n}/${r.stock_count})</span>`;
}
// One sector/industry row, as in the cards: rank · name (stocks · near high) · current % · change.
function groupRow(r, i, extra = "") {
  return `<div class="mover${extra}">
      <span class="rank">${i + 1}</span>
      <span class="nm"><span class="name" title="${esc(r.name)}"><i class="caret">▸</i>${esc(r.name)}</span>${nearCount(r.sector ? "industry" : "sector", r)}</span>
      <span class="vals">${fmt(r.value)}</span>

    </div>`;
}
function item(kind, r, inner) {
  const key = kind + "|" + r.name, open = state.openStocks.has(key);

function moverList(el, rows, showSector) {

}

const topByLevel = rows => rows
  .filter(r => r.value != null && (r.stock_count ?? 0) >= (state.data.min_group_stocks ?? 3))  // skip tiny groups
  .sort((a, b) => b.value - a.value).slice(0, 5);

function leaderList(el, rows, showSector) {

  if (!top.length) { el.innerHTML = `<div class="empty">No data.</div>`; return; }

// All sectors / All industries tables. Current % and Delta headers sort (click again to flip).
const COLS = [["value", "Current %"], ["change", "Delta"]];
function sortRows(kind, rows) {  // the table's current sort (also used for the All-view export order)
  const { key, dir } = state.sort[kind];
  return [...rows].sort((a, b) => dir * (((a[key] ?? -1e9) - (b[key] ?? -1e9)) || ((a.value ?? 0) - (b.value ?? 0))));
}
function groupTable(kind, rows) {
  const { key, dir } = state.sort[kind];
  const sorted = sortRows(kind, rows);
  const head = `<thead><tr><th></th><th>${kind === "sector" ? "Sector" : "Industry"}</th>` +
    COLS.map(([k, l]) => `<th class="sortable${k === key ? " sorted" : ""}" data-kind="${kind}" data-sort="${k}" aria-sort="${k === key ? (dir > 0 ? "ascending" : "descending") : "none"}">${l}${k === key ? (dir > 0 ? " ↑" : " ↓") : ""}</th>`).join("") + `</tr></thead>`;
  const body = sorted.map((r, i) => {
    // own key per table: opening a row here doesn't also open the same group in the cards above
    const sk = `table-${kind}|${r.name}`, open = state.openStocks.has(sk);
    return `<tr data-key="${esc(sk)}" class="row${open ? " open" : ""}"><td class="rank">${i + 1}</td>
      <td class="name"><span class="nm"><span class="name" title="${esc(r.name)}"><i class="caret">▸</i>${esc(r.name)}</span>${nearCount(kind, r)}</span></td>
      <td class="num">${fmt(r.value)}</td>
      <td class="delta ${cls(r.change)}">${state.data.prev_date ? fmtD(r.change) : "—"}</td></tr>` +
      (open ? `<tr><td class="panel" colspan="4">${stocksPanel(kind, r.name)}</td></tr>` : "");
  }).join("");
  return head + `<tbody>${body}</tbody>`;
}
function renderTable() {
  const { sectors, industries } = state.data;

  $("secTable").innerHTML = groupTable("sector", sectors);

document.addEventListener("click", e => {

function render() {

// ---- TradingView export: "###Section,EXCH:SYM,..." (TradingView sections are one level deep,
// so each card is a header section followed by one section per sector/industry).
const tvSymbol = st => state.market === "us" ? `${st.exchange}:${st.symbol}`
  : `${st.exchange || "NSE"}:${st.symbol.replace(/[^A-Za-z0-9]/g, "_")}`;
const tvName = n => n.replace(/[,#]/g, "").replace(/\s+/g, " ").trim();
function buildTradingViewList() {
  if (state.page === "setups") {  // one section: every setup stock once, in the page's order
    const syms = curList().map(st => `${st.exchange || "NSE"}:${st.symbol.replace(/[^A-Za-z0-9]/g, "_")}`);
    return { text: [`###${tvName("Setups - " + filtersText(" + ")).toUpperCase()} (${syms.length})`, ...syms].join(","),
             count: syms.length, sections: 1 };
  }
  const d = state.data, ts = d.top_stocks || {};
  // Strong view: the four cards. All view: every sector (header) followed by its industries' stocks —
  // a sector's stocks are its industries' stocks, so this covers both without listing anything twice.
  const cards = state.view === "all"
    ? sortRows("sector", d.sectors || []).map(sec => [
        `${tvName(sec.name).toUpperCase()} (${(ts.sector?.[sec.name] || []).length})`, "industry",
        sortRows("industry", (d.industries || []).filter(i => i.sector === sec.name))])
    : [
    ["STRONG SECTORS TODAY", "sector", d.strength || []],
    ["STRONG INDUSTRIES TODAY", "industry", d.industry_strength || []],
    ["STRONG SECTORS", "sector", topByLevel(d.sectors || [])],
    ["STRONG INDUSTRIES", "industry", topByLevel(d.industries || [])],
  ];
  const seen = new Set(), parts = [];
  let count = 0, sections = 0;
  for (const [title, kind, groups] of cards) {
    if (!groups.some(g => (ts[kind]?.[g.name] || []).length)) continue;  // skip headers with no stocks under them
    parts.push("###" + title); sections++;
    for (const g of groups) {
      const all = (ts[kind]?.[g.name] || []).map(tvSymbol);
      if (!all.length) continue;
      const fresh = all.filter(x => !seen.has(x));  // a watchlist can hold each symbol only once
      fresh.forEach(x => seen.add(x));
      const dup = all.length - fresh.length;
      parts.push(`###${tvName(g.name)} (${all.length}${dup ? ` - ${dup} listed above` : ""})`, ...fresh);
      count += fresh.length;
    }
  }
  return { text: parts.join(","), count, sections };
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = Object.assign(document.createElement("textarea"), { value: text });
  document.body.appendChild(ta); ta.select();
  const ok = document.execCommand("copy"); ta.remove(); return ok;
}
const exportReady = () => state.page === "setups" ? !!setups.data?.date : !!state.data?.date;
$("tvCopy").addEventListener("click", async () => {
  if (!exportReady()) return;
  const { text, count, sections } = buildTradingViewList();
  if (!count) { $("status").textContent = "No stocks to copy for this session."; return; }
  $("status").textContent = (await copyText(text))
    ? `Copied ${count} symbols in ${sections} sections. In TradingView, paste into a watchlist's “Add symbol” box, or use ↓ .txt with “Import list…” to keep the sections.`
    : "Copy failed — use ↓ .txt instead.";
});
$("tvDownload").addEventListener("click", () => {

  const { text, count } = buildTradingViewList();
  const a = Object.assign(document.createElement("a"), {
    href: URL.createObjectURL(new Blob([text], { type: "text/plain" })),
    download: state.page === "setups"
      ? `Market Analysis India ${setups.data.date} Setups with ${filtersText(" + ")}.txt`
      : `Market Analysis ${state.data.market_name || "India"} ${state.data.date} ${state.view === "all" ? "All" : "Strong"} within ${pctLabel()}.txt`,
  });
  a.click(); URL.revokeObjectURL(a.href);
  $("status").textContent = `Downloaded ${count} symbols. In TradingView: watchlist name ▾ → Import list… → choose this file.`;
});

// ---- Setups page: the stocks in any of the Trendvue setup scans (High Tight Flag, Near All-Time High, Top Movers) that
// pass the filters (Tight Consolidation, above EMA 50), each listed once on the left with the chart on the right, like
// Trendvue's watchlist; the chart header names the scans it's in. ↑/↓ (or ‹ ›) flip through the list.
const RANGES = { daily: { "1M": 22, "3M": 66, "6M": 132, "1Y": 252 }, weekly: { "6M": 26, "1Y": 52, "3Y": 156, "5Y": 260 } };
const EMAS = [["ema20", "EMA 20"], ["ema50", "EMA 50"], ["ema200", "EMA 200"]];
const setups = { data: null, strong: new Map(), strongMetric: null, sel: null, freq: "daily", range: { daily: "1Y", weekly: "5Y" }, chart: null };
// "Tight Consolidation and above EMA 50": the filters every setup stock passes
const filtersText = sep => (setups.data?.filters || [setups.data?.filter?.name || "the filter scan"]).join(sep);
const curList = () => setups.data?.stocks || [];  // each stock once, tightest first
const scansOf = sym => (setups.data?.setups || []).filter(su => su.symbols.includes(sym));
try {
  const c = JSON.parse(localStorage.getItem("setupChart") || "null");
  if (c && RANGES[c.freq]) setups.freq = c.freq;
  for (const f in RANGES) if (c?.range?.[f] in RANGES[f]) setups.range[f] = c.range[f];
} catch (e) {}
const saveChartPrefs = () => { try { localStorage.setItem("setupChart", JSON.stringify({ freq: setups.freq, range: setups.range })); } catch (e) {} };

const fmtP = v => v == null ? "—" : v.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtV = v => v == null ? "—" : v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? (v / 1e3).toFixed(0) + "K" : String(v);
const fmtPct = v => v == null ? "—" : (r1(v) > 0 ? "+" : "") + r1(v).toFixed(1) + "%";
const fmtBarDate = d => new Date(d + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });

// India's strong sectors = the Breadth page's Strong-view sector cards (top 5 today, top 5 now) at the selected %,
// marked green on the Setups chart header. Map: sector -> why it's strong.
async function loadStrongSectors() {
  const metric = state.metric, strong = new Map();
  try {
    const d = state.market === "in" && state.data?.date && state.data.metric === metric ? state.data
      : window.STATIC_SITE ? await loadStatic("in")
      : await fetch("/api/compare?" + new URLSearchParams({ market: "in", metric })).then(r => r.json());
    const add = (name, why) => strong.set(name, [...(strong.get(name) || []), why]);
    for (const r of d.strength || []) add(r.name, `Top 5 strong sectors today (+${r.change.toFixed(1)} pts)`);
    (d.sectors || []).filter(r => r.value != null && (r.stock_count ?? 0) >= (d.min_group_stocks ?? 3))
      .sort((a, b) => b.value - a.value).slice(0, 5).forEach(r => add(r.name, `Top 5 strong sectors (${fmt(r.value)} within ${pctLabel()} of 52W high)`));
  } catch (e) {}  // no marking rather than no page
  setups.strong = strong; setups.strongMetric = metric;
}
async function loadSetups() {
  const strongDone = loadStrongSectors();
  const d = window.STATIC_SITE
    ? await fetch("data/setups.json", { cache: "no-store" }).then(r => r.ok ? r.json() : { date: null, setups: [], stocks: [] })
    : await fetch("/api/setups").then(r => {
        if (r.status === 404) throw new Error("the server doesn't know /api/setups yet — restart it (python3 server.py)");
        return r.json();
      });
  if (d.error) throw new Error(d.error);
  await strongDone;
  // Price and 1D/1W/1M from the chart's own daily bars, so the list, the stats and the chart agree: after the close
  // Trendvue's scan rows can show the previous session's close and move while the bars already have today's.
  for (const st of d.stocks || []) {
    const b = d.charts?.[st.symbol]?.daily || [], n = b.length, close = k => b[n - 1 - k]?.[4];
    if (!close(0)) continue;
    const move = k => close(k) ? (close(0) / close(k) - 1) * 100 : null;
    Object.assign(st, { close: close(0), change_1d: move(1), change_1w: move(5), change_1m: move(21) });
  }
  setups.data = d;
  const syms = curList().map(s => s.symbol);
  if (!syms.includes(setups.sel)) setups.sel = syms[0] ?? null;
  if (state.page === "setups") renderSetups();
}

// OHLC bars on a log price scale with EMA 20/50/200 and a volume pane, as on Trendvue. Hover for a bar's values.
function drawChart() {
  const el = $("chart"); if (!el) return;
  const st = curList()[selIndex()];
  const F = setups.data.bar_fields || ["date", "open", "high", "low", "close", "volume", "ema20", "ema50", "ema200"];
  const all = ((setups.data.charts || {})[st.symbol] || {})[setups.freq] || [];
  const bars = all.slice(-RANGES[setups.freq][setups.range[setups.freq]]).map(r => Object.fromEntries(F.map((k, j) => [k, r[j]])));
  const prevClose = j => j > 0 ? bars[j - 1].close : (all.length > bars.length ? all[all.length - bars.length - 1][4] : null);
  if (!bars.length) { el.innerHTML = `<div class="chempty">No chart data for ${esc(st.symbol)}.</div>`; $("clegend").innerHTML = ""; return; }

  const W = Math.max(280, el.clientWidth);
  const H = W < 520 ? 300 : Math.round(Math.max(380, Math.min(W * 0.75, innerHeight - (el.getBoundingClientRect().top + scrollY) - 40)));
  const M = { t: 8, r: 62, b: 22, l: 4 }, iw = W - M.l - M.r, ih = H - M.t - M.b;
  const hasVol = bars.some(b => b.volume > 0), gap = 10;
  const volH = hasVol ? Math.round(ih * 0.2) : 0, ph = ih - (hasVol ? volH + gap : 0);
  const RIGHT_GAP = 5;  // empty bar slots between the last bar and the price axis
  const n = bars.length, step = iw / (n + RIGHT_GAP), bw = Math.max(1, Math.min(step * 0.7, 14));
  const x = j => M.l + step * (j + 0.5);
  let lo = Infinity, hi = -Infinity;
  for (const b of bars) for (const k of ["low", "high", "ema20", "ema50", "ema200"])
    if (b[k] > 0) { lo = Math.min(lo, b[k]); hi = Math.max(hi, b[k]); }
  const pad = (Math.log(hi) - Math.log(lo)) * 0.05 || 0.01, l0 = Math.log(lo) - pad, l1 = Math.log(hi) + pad;
  const y = v => M.t + ph * (1 - (Math.log(v) - l0) / (l1 - l0));
  const yInv = py => Math.exp(l0 + (1 - (py - M.t) / ph) * (l1 - l0));
  const vmax = Math.max(1, ...bars.map(b => b.volume || 0));
  const vy = v => M.t + ph + gap + volH * (1 - (v || 0) / vmax);
  const f1 = v => v.toFixed(1);

  // price grid: evenly spaced on the log scale, rounded to a readable step
  const nice = v => v < 1 ? .05 : v < 2 ? .1 : v < 5 ? .25 : v < 10 ? .5 : v < 100 ? 5 : v < 1e3 ? 10 : v < 1e4 ? 50 : v < 1e5 ? 100 : 500;
  const ticks = [...new Set(Array.from({ length: 6 }, (_, k) => { const v = Math.exp(l0 + (l1 - l0) * (k + 0.5) / 6), s = nice(v); return +(Math.round(v / s) * s).toFixed(2); }))]
    .filter(v => v > Math.exp(l0) && v < Math.exp(l1));
  let svg = ticks.map(v => `<line x1="${M.l}" x2="${M.l + iw}" y1="${f1(y(v))}" y2="${f1(y(v))}" stroke="var(--grid)"/>` +
    `<text x="${M.l + iw + 6}" y="${f1(y(v) + 4)}">${nice(v) >= 1 ? Math.round(v).toLocaleString("en-IN") : fmtP(v)}</text>`).join("");

  // date axis: years first, then months where they fit
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const cand = [];
  for (let j = 1; j < n; j++) {
    const a = bars[j - 1].date, b = bars[j].date;
    if (a.slice(0, 7) !== b.slice(0, 7)) cand.push({ j, year: a.slice(0, 4) !== b.slice(0, 4), label: a.slice(0, 4) !== b.slice(0, 4) ? b.slice(0, 4) : MON[+b.slice(5, 7) - 1] });
  }
  const placed = [], fits = j => placed.every(p => Math.abs(x(p.j) - x(j)) >= 46) && x(j) > M.l + 14 && x(j) < M.l + iw - 14;
  for (const c of cand.filter(c => c.year)) if (fits(c.j)) placed.push(c);
  for (const c of cand.filter(c => !c.year)) if (fits(c.j)) placed.push(c);
  svg += placed.map(c => `<line x1="${f1(x(c.j))}" x2="${f1(x(c.j))}" y1="${M.t}" y2="${M.t + ih}" stroke="var(--grid)" stroke-opacity=".6"/>` +
    `<text x="${f1(x(c.j))}" y="${H - 6}" text-anchor="middle"${c.year ? ` style="fill:var(--ink-2)"` : ""}>${c.label}</text>`).join("");

  // volume, then OHLC bars (high-low line, open tick left, close tick right), then EMAs on top
  if (hasVol) {
    const d = bars.map((b, j) => b.volume
      ? `M${f1(x(j) - bw / 2)} ${f1(vy(b.volume))}h${f1(bw)}V${f1(vy(0))}h${f1(-bw)}Z` : "").join("");
    svg += `<path d="${d}" fill="var(--price-bar)" fill-opacity=".22"/>`;
  }
  const tw = Math.max(1, Math.min(step * 0.4, 6));
  let ohlc = "";
  bars.forEach((b, j) => {
    if (!(b.low > 0)) return;
    const cx = f1(x(j));
    ohlc += `M${cx} ${f1(y(b.high))}V${f1(y(b.low))}M${f1(x(j) - tw)} ${f1(y(b.open))}H${cx}M${cx} ${f1(y(b.close))}H${f1(x(j) + tw)}`;
  });
  svg += `<path d="${ohlc}" stroke="var(--price-bar)" stroke-width="${step >= 5 ? 1.5 : 1}" fill="none"/>`;
  for (const [k] of EMAS) {
    let d = "", pen = false;
    bars.forEach((b, j) => { if (b[k] > 0) { d += `${pen ? "L" : "M"}${f1(x(j))} ${f1(y(b[k]))}`; pen = true; } else pen = false; });
    svg += `<path d="${d}" stroke="var(--${k})" stroke-width="1.25" stroke-opacity=".6" fill="none" stroke-linejoin="round"/>`;  // recede behind the bars
  }
  // last close tag on the price axis
  const last = bars[n - 1];
  svg += `<g class="tag"><rect x="${M.l + iw + 2}" y="${f1(y(last.close) - 9)}" width="${M.r - 4}" height="18" rx="4"/>` +
    `<text x="${M.l + iw + 6}" y="${f1(y(last.close) + 4)}">${fmtP(last.close)}</text></g>`;
  // crosshair (hidden until hover) and the hover target
  svg += `<g id="xhair" visibility="hidden"><line class="xh" id="xhV" y1="${M.t}" y2="${M.t + ih}"/><line class="xh" id="xhH" x1="${M.l}" x2="${M.l + iw}"/>` +
    `<g class="tag"><rect id="xhR" x="${M.l + iw + 2}" width="${M.r - 4}" height="18" rx="4"/><text id="xhT" x="${M.l + iw + 6}"></text></g></g>` +
    `<rect id="xhit" x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(`${st.symbol} ${setups.freq} OHLC bar chart, ${setups.range[setups.freq]}, with EMA 20, 50 and 200`)}">${svg}</svg>`;

  const legend = j => {
    const b = bars[j], pc = prevClose(j), chg = pc ? (b.close / pc - 1) * 100 : null;
    $("clegend").innerHTML = `<span>${esc(setups.freq === "weekly" ? "Week of " + fmtBarDate(b.date) : fmtBarDate(b.date))}</span>` +
      `<span><span class="k">O</span> ${fmtP(b.open)} <span class="k">H</span> ${fmtP(b.high)} <span class="k">L</span> ${fmtP(b.low)} <span class="k">C</span> ${fmtP(b.close)}` +
      (chg == null ? "" : ` <span class="delta ${cls(r1(chg))}">${fmtPct(chg)}</span>`) + `</span>` +
      (hasVol ? `<span><span class="k">Vol</span> ${fmtV(b.volume)}</span>` : "") +
      EMAS.map(([k, l]) => `<span><span class="sw" style="background:var(--${k})"></span>${l}</span>`).join("");  // key only, no values
  };
  legend(n - 1);
  const svgEl = el.querySelector("svg"), hit = $("xhit"), xh = $("xhair");
  const move = e => {
    const r = svgEl.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width, py = (e.clientY - r.top) * H / r.height;
    const j = Math.max(0, Math.min(n - 1, Math.floor((px - M.l) / step)));
    xh.setAttribute("visibility", "visible");
    $("xhV").setAttribute("x1", x(j)); $("xhV").setAttribute("x2", x(j));
    const inPrice = py >= M.t && py <= M.t + ph;
    $("xhH").setAttribute("visibility", inPrice ? "visible" : "hidden");
    $("xhR").parentNode.setAttribute("visibility", inPrice ? "visible" : "hidden");
    if (inPrice) {
      $("xhH").setAttribute("y1", py); $("xhH").setAttribute("y2", py);
      $("xhR").setAttribute("y", py - 9); $("xhT").setAttribute("y", py + 4); $("xhT").textContent = fmtP(yInv(py));
    }
    legend(j);
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); legend(n - 1); });
}
let chartResizeFrame = 0, chartWidth = 0;
new ResizeObserver(() => {
  const w = $("setupChart").clientWidth;
  if (state.page !== "setups" || !$("chart") || w === chartWidth) return;
  chartWidth = w; cancelAnimationFrame(chartResizeFrame); chartResizeFrame = requestAnimationFrame(drawChart);
}).observe($("setupChart"));
let chartWinH = innerHeight;  // the chart fills the window's height: redraw when that changes
addEventListener("resize", () => {
  if (innerHeight === chartWinH) return;
  chartWinH = innerHeight;
  if (state.page === "setups" && $("chart")) { cancelAnimationFrame(chartResizeFrame); chartResizeFrame = requestAnimationFrame(drawChart); }
});
renderMetricSeg();
loadMarkets().then(load).catch(e => { if (state.page !== "setups") $("subtitle").textContent = "Could not reach the server: " + e.message; });
if (state.page === "setups") loadSetups().catch(setupsFailed);
// While a live session is on screen, pick up the server's periodic live refreshes.
setInterval(() => {
  if (state.page === "setups") { if (setups.data?.live) loadSetups().catch(() => {}); }
  else if (state.data?.live) load().catch(() => {});
}, 120000);
</script>
</body>
</html>
